name: Deploy

on:
  push:
    branches:
      - master

env:
  DEPLOY_ROOT: /var/www/msnus/data/www/vinetsky.com/heroes

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Sync to latest code
        run: |
          git -C ${{ github.workspace }} fetch origin master
          git -C ${{ github.workspace }} reset --hard origin/master

      - name: Increment version
        id: version
        run: |
          COUNTER_FILE=$HOME/.lakeheroes-deploy-version
          if [ -f "$COUNTER_FILE" ]; then
            N=$(cat "$COUNTER_FILE")
          else
            N=0
          fi
          N=$((N + 1))
          echo $N > "$COUNTER_FILE"
          echo "tag=0.$N" >> $GITHUB_OUTPUT

      - name: Install dependencies
        # --no-audit/--no-fund trim work on a memory-tight self-hosted runner;
        # the timeout fails fast instead of thrashing for 20+ min if the box
        # runs out of memory mid-install (was OOM-killed with exit 137).
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: ${{ github.workspace }}
        timeout-minutes: 6

      - name: Build
        run: npm run build
        working-directory: ${{ github.workspace }}
        timeout-minutes: 6

      - name: Write version file
        run: echo "${{ steps.version.outputs.tag }}" > ${{ github.workspace }}/dist/version.txt

      - name: Publish versioned build
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          TARGET=${{ env.DEPLOY_ROOT }}/$VERSION
          mkdir -p "$TARGET"
          cp -r ${{ github.workspace }}/dist/. "$TARGET/"
          ln -sfn "$TARGET" ${{ env.DEPLOY_ROOT }}/current
          echo "Published $VERSION → ${{ env.DEPLOY_ROOT }}/current"

      - name: Prune old builds
        # Keep the newest 15 versioned builds (the just-published one included)
        # so the deploy dir doesn't fill the disk over time. The `current`
        # symlink always points at the newest, so it's never pruned.
        run: |
          cd ${{ env.DEPLOY_ROOT }}
          ls -d 0.* | sort -t. -k2 -n | head -n -15 | xargs -r rm -rf
          echo "Kept $(ls -d 0.* | wc -l) builds; current → $(readlink current)"
