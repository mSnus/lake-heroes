services:
  app:
    build: { context: ., dockerfile: docker/php/Dockerfile }
    volumes: [ ./laravel:/var/www/html ]
    depends_on: [ mysql ]
    env_file: .env

  nginx:
    image: nginx:1.27-alpine
    # 8080 is taken by another project on this box; bind to loopback only --
    # the site's nginx proxies /heroes/api/ here, nothing reaches it directly.
    ports: [ "127.0.0.1:8091:80" ]
    volumes:
      - ./laravel:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [ app ]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes: [ db_data:/var/lib/mysql ]
    # No host port: the host already runs MySQL on 3306, and only the `app`
    # service needs the DB -- it reaches it over the compose network.

volumes:
  db_data:
